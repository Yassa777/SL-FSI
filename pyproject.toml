[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slfsi"
version = "0.1.0"
description = "Sri Lanka Financial Stress Index pipeline"
readme = "DOCS/README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "hmmlearn>=0.3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
visualization = [
  "matplotlib>=3.8.0",
  "plotly>=5.17.0",
  "streamlit>=1.28.0",
]
data = [
  "yfinance>=0.2.33",
  "pandas-datareader>=0.10.0",
  "requests>=2.31.0",
]
ml = [
  "scikit-learn>=1.3.0",
  "arch>=6.3.0",
  "ruptures>=1.1.0",
]
dev = [
  "pytest>=7.4.0",
  "mypy>=1.8.0",
  "ruff>=0.3.0",
  "types-requests>=2.31.0.20240106",
  "pandas-stubs>=2.0.0.230412",
]

[project.scripts]
slfsi = "slfsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.isort]
known-first-party = ["slfsi"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
